buildscript {
    ext {
        kotlin_version = project.findProperty("kotlinVersion") ?: "2.3.21"
        ksp_version = project.findProperty("kspVersion") ?: "2.3.7"
        java_version = project.findProperty("javaVersion") ?: "11"
        agp_version = project.findProperty("agpVersion") ?: System.getenv('AGP_VERSION')
    }
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        // TODO: Remove this override once AGP 9.2.0+ is used (AGP < 9.2.0 bundles R8 < 9.1.29,
        // which cannot rewrite Kotlin 2.4+ metadata during D8 dexing).
        if (GradleVersion.version(kotlin_version) >= GradleVersion.version("2.4.0")) {
            classpath "com.android.tools:r8:9.1.56"
        }
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "com.android.legacy-kapt:com.android.legacy-kapt.gradle.plugin:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:$ksp_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:LOCAL-SNAPSHOT'
    }
}

allprojects {
    repositories {
      google()
      mavenCentral()
      mavenLocal()
    }
    // TODO(bcorso): Consider organizing all projects under a single project
    // that share a build.gradle configuration to reduce the copy-paste.
    // Local tests: Adds logs for individual local tests
    tasks.withType(Test) {
        testLogging {
            exceptionFormat "full"
            showCauses true
            showExceptions true
            showStackTraces true
            showStandardStreams true
            events = ["passed", "skipped", "failed", "standardOut", "standardError"]
        }
    }
}

subprojects {
    plugins.withType(com.android.build.gradle.BasePlugin).configureEach {
        project.android {
            compileOptions {
                sourceCompatibility JavaVersion.toVersion(java_version)
                targetCompatibility JavaVersion.toVersion(java_version)
            }
        }
    }

    plugins.withType(org.jetbrains.kotlin.gradle.plugin.KotlinBasePluginWrapper).configureEach {
        kotlin {
            jvmToolchain(java_version.toInteger())
        }
    }
}
