name: Dagger Release

on:
  workflow_dispatch:
    inputs:
      dagger_release_version:
        description: 'The Dagger version to use in this release.'
        required: true

# Cancel in-progress jobs for the same workflow and branch except for the master branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  USE_AGP_VERSION: '9.0.0'
  USE_JAVA_DISTRIBUTION: 'zulu'
  USE_JAVA_VERSION_FOR_BAZEL: '21'
  USE_JAVA_VERSION_FOR_GRADLE: '21'
  DAGGER_RELEASE_VERSION: "${{ github.event.inputs.dagger_release_version }}"

# TODO(bcorso):Convert these jobs into local composite actions to share with the
# continuous integration workflow.
jobs:
  validate-latest-dagger-version:
    name: 'Validate Dagger version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prechecks
  bazel-build:
    name: 'Bazel build'
    needs: validate-latest-dagger-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/bazel-build
  bazel-test:
    name: 'Bazel tests'
    needs: validate-latest-dagger-version
    runs-on:
      group: large-runner-group
      labels: ubuntu-22.04-16core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/bazel-test
  artifact-verification-tests:
    name: 'Artifact verification tests'
    needs: bazel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/artifact-verification-tests
  artifact-java-local-tests:
    name: 'Artifact Java local tests'
    needs: bazel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/artifact-java-local-tests
  test-gradle-plugin:
    name: 'Test Hilt Gradle plugin'
    needs: bazel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-gradle-plugin
  artifact-android-local-tests:
    name: 'Artifact Android local tests'
    needs: bazel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/artifact-android-local-tests
  publish-artifacts:
    name: 'Publish Artifact'
    needs: [
      bazel-test,
      artifact-verification-tests,
      artifact-java-local-tests,
      artifact-android-local-tests,
      test-gradle-plugin
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 'Install Java ${{ env.USE_JAVA_VERSION_FOR_BAZEL }}'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: '${{ env.USE_JAVA_DISTRIBUTION }}'
          java-version: '${{ env.USE_JAVA_VERSION_FOR_BAZEL }}'
          server-id: oss-exit-gate
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE
      - name: 'Check out repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 'Cache local Maven repository'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/google/dagger
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: 'Cache Bazel files'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel_github # The bazel cache path set in .bazelrc.
          key: ${{ runner.os }}-bazel-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bazel-build-
      - name: 'Cache Gradle files'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: 'Authenticate to Google Cloud (OSS Exit Gate)'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 'Clean up failed staging attempt for this exact version (if any)'
        run: |
          set -euo pipefail
          PKGS=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="dagger--mavencentral" \
            --format="value(name)" 2>/dev/null || true)
          for pkg in ${PKGS}; do
            pkg_id="$(basename "${pkg}")"
            if gcloud artifacts versions describe "${DAGGER_RELEASE_VERSION}" \
              --package="${pkg_id}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="dagger--mavencentral" >/dev/null 2>&1; then
              echo "Deleting incomplete staged ${pkg_id}@${DAGGER_RELEASE_VERSION} before retry..."
              gcloud artifacts versions delete "${DAGGER_RELEASE_VERSION}" \
                --package="${pkg_id}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="dagger--mavencentral" \
                --quiet
            fi
          done
        shell: bash
      - name: 'Publish artifacts to OSS Exit Gate staging'
        run: |
          set -euo pipefail
          export CI_DEPLOY_USERNAME="oauth2accesstoken"
          export CI_DEPLOY_PASSWORD="$(gcloud auth print-access-token)"
          util/deploy-all.sh \
            "gpg:sign-and-deploy-file" \
            "${DAGGER_RELEASE_VERSION}" \
            "-DrepositoryId=oss-exit-gate" \
            "-Durl=https://us-maven.pkg.dev/oss-exit-gate-prod/dagger--mavencentral"
        shell: bash
        env:
          CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
      - name: 'Upload OSS Exit Gate publishing manifest'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, json, os, subprocess
          ver = os.environ["DAGGER_RELEASE_VERSION"]
          pkgs_out = subprocess.check_output([
              "gcloud", "artifacts", "packages", "list",
              "--project=oss-exit-gate-prod",
              "--location=us",
              "--repository=dagger--mavencentral",
              "--format=value(name)",
          ], text=True).splitlines()
          groups = collections.defaultdict(list)
          for p in sorted(pkgs_out):
            pkg_id = p.strip().split("/")[-1]
            if ":" not in pkg_id:
              continue
            rc = subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg_id}",
                "--project=oss-exit-gate-prod",
                "--location=us",
                "--repository=dagger--mavencentral",
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode
            if rc == 0:
              ns, name = pkg_id.split(":", 1)
              groups[ns].append({"name": name, "version": ver})
          assert groups, f"No staged Maven packages found for version {ver}"
          manifest = {
              "publish_all": False,
              "publishing_groups": [
                  {"namespace": ns, "packages": pkgs}
                  for ns, pkgs in sorted(groups.items())
              ],
          }
          with open("manifest.json", "w") as fh:
            json.dump(manifest, fh, indent=2)
          print(f"Generated manifest.json with {sum(len(v) for v in groups.values())} staged packages across {list(groups.keys())}")
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/dagger/mavencentral/manifests/manifest-${DAGGER_RELEASE_VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
        shell: bash
      - name: 'Set git credentials'
        run: |
            git config --global user.email "dagger-dev+github@google.com"
            git config --global user.name "Dagger Team"
        shell: bash
      - name: 'Publish tagged release'
        run: util/publish-tagged-release.sh ${DAGGER_RELEASE_VERSION}
        shell: bash
      - name: 'Publish tagged docs'
        run: util/publish-tagged-docs.sh ${DAGGER_RELEASE_VERSION}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 'Clean bazel cache'
        run: rm -rf $(bazel info repository_cache)
        shell: bash
